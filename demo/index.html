<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directory — Stefan Ćirković</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black-900:#0a0a0a; --black-700:#141110;
    --black-600:rgba(10,10,10,.64); --black-500:rgba(10,10,10,.56);
    --black-400:rgba(10,10,10,.48); --black-300:rgba(10,10,10,.32);
    --black-200:rgba(10,10,10,.24); --black-100:rgba(10,10,10,.12);
    --black-50:rgba(10,10,10,.06);
    --white:#fff; --bg:whitesmoke;
    --ease:cubic-bezier(.455,.03,.515,.955);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --r-card:1rem;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased}
  body{background:var(--bg);color:var(--black-900);font-family:Geist,system-ui,sans-serif;font-size:1rem;line-height:1.5;min-height:100vh}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  a{color:inherit;text-decoration:none}
  .container{max-width:90rem;margin:0 auto;padding:0 4rem}


  /* ===== from stefancirkovic.com (Webflow) ===== */
  a{color:inherit}
  .padding-global{padding-left:1.5rem;padding-right:1.5rem}
  .container-medium{width:100%;max-width:63rem;margin-left:auto;margin-right:auto}
  .navbar{position:fixed;top:0;left:0;right:0;z-index:9999;padding-top:10px;padding-bottom:10px;background-color:var(--bg);transition:transform .35s cubic-bezier(.4,0,.2,1)}
  .navbar-flex{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:16px}
  .link-logo{display:flex;align-items:center}
  .logo-desktop{display:block}
  .logo-mobile{display:none}
  .nav-menu{display:flex;justify-content:flex-end;align-items:center;gap:1.5rem;justify-self:end}
  .nav-link{padding:7px 0;color:var(--black-900);line-height:1.48;font-weight:500;text-decoration:none}
  .nav-link-cta{padding:7px 0;color:var(--black-900);line-height:1.48;font-weight:500;text-decoration:none}
  .nav-link-cta.nav-cta{display:flex;overflow:hidden;padding:10px;align-items:center;gap:1rem;border-radius:12px;background-color:#fff}
  .nav-icon-wrapper{display:flex;overflow:hidden;width:1.625rem;height:1.625rem;justify-content:center;align-items:center;border-radius:6.26px;background-color:#f5f5f5}
  .nav-link-icon{width:.5rem;transition:transform .3s cubic-bezier(.22,1,.36,1)}
  .nav-cta:hover .nav-link-icon{animation:slide-through .3s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes slide-through{0%{transform:translateX(0)}40%{transform:translateX(200%)}41%{transform:translateX(-200%)}100%{transform:translateX(0)}}
  .menu-button-main{display:none}
  .nav-overlay{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:100}
  .nav-overlay.is-open{opacity:.42;pointer-events:auto}

  .section_hero{padding-top:18rem;padding-bottom:4rem}
  .hero-content-wrapper{display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:2.625rem}
  .heading-style-h4{font-size:3rem;line-height:1;font-weight:400;letter-spacing:-.03em;margin:0}
  .home-hero-sub{max-width:314px;color:var(--black-400);font-size:1.125rem;line-height:1.24}

  .footer{padding-top:2.5rem;padding-bottom:2.5rem}
  .footer-container{max-width:90rem;margin:0 auto;padding-left:4rem;padding-right:4rem}
  .footer-content-wrapper{display:grid;grid-template-columns:1fr 1fr}
  .footer-content-left{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem}
  .footer-content-right{display:flex;flex-direction:column;align-items:flex-end;gap:.5rem}
  .footer-text{display:flex;gap:5px;line-height:1}
  .footer-text.gap-0{gap:0}
  .footer-text a{text-decoration:none}
  .footer-text-gray{color:var(--black-400)}

  @media (max-width:991px){
    .grid{grid-template-columns:repeat(3,1fr)}
    .navbar{padding-top:1rem;padding-bottom:1rem}
    .logo-desktop{display:none}
    .logo-mobile{display:block}
    .menu-button-main{display:flex;flex-direction:column;justify-content:center;gap:6px;width:44px;height:32px;padding:0 11px;justify-self:end;z-index:1;position:relative}
    .menu-button-main span{display:block;height:1.5px;background:var(--black-900);border-radius:2px;transition:transform .35s var(--ease-out)}
    .navbar.open .menu-button-main span:first-child{transform:translateY(3.75px) rotate(45deg)}
    .navbar.open .menu-button-main span:last-child{transform:translateY(-3.75px) rotate(-45deg)}
    .nav-menu{position:fixed;left:0;right:0;top:0;z-index:-1;justify-self:stretch;flex-direction:column;gap:0;padding:5.375rem 1.5rem 2rem;border-radius:0 0 2rem 2rem;background:#fff;transform:translateY(-100%);transition:transform .45s cubic-bezier(.16,1,.3,1)}
    .navbar.open .nav-menu{transform:none}
    .nav-link{padding:8px 0;font-size:1.375rem;line-height:1.24;text-align:center}
    .nav-link-cta.nav-cta{display:inline-flex;margin-top:2rem;justify-content:center;font-size:1.375rem;line-height:1.24;background:var(--bg)}
    .section_hero{padding-top:5.125rem;padding-bottom:1.5rem}
    .hero-content-wrapper{grid-template-columns:1fr;row-gap:1rem}
    .heading-style-h4{font-size:2rem;line-height:1.15}
    .home-hero-sub{font-size:1rem;line-height:1.48}
    .footer-content-left{display:none}
    .footer-content-wrapper{display:flex;justify-content:center}
    .footer-content-right{align-items:center}
    .footer-container{padding-left:1.5rem;padding-right:1.5rem}
  }
  @media (max-width:767px){ .home-hero-sub{max-width:none} }
  @media (max-width:479px){ .footer-text{text-align:center} }

</style>
<link rel="stylesheet" href="../directory.css">
</head>
