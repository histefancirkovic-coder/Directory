<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark"></span>Add to Directory</div>
    <button id="gear" class="icon-btn" title="Settings" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </button>
  </header>

  <!-- settings -->
  <section id="settings" hidden>
    <p class="hint">Paste a GitHub fine-grained token with <b>Contents: Read and write</b> access to the <b>Directory</b> repo. It is stored only in this browser.</p>
    <label class="field"><span>GitHub token</span><input id="token" type="password" placeholder="github_pat_…" autocomplete="off"></label>
    <label class="field"><span>Repository</span><input id="repo" type="text" value="histefancirkovic-coder/Directory"></label>
    <div class="row"><button id="saveSettings" class="btn dark">Save</button><span id="settingsMsg" class="msg"></span></div>
  </section>

  <!-- main form -->
  <section id="form" hidden>
    <div class="thumb" id="thumb">
      <img id="thumbImg" alt="" hidden>
      <div class="thumb-empty" id="thumbEmpty">No thumbnail</div>
      <span class="badge" id="srcBadge"></span>
    </div>
    <div class="thumb-actions">
      <button class="chip-btn" id="useOg">Page image</button>
      <button class="chip-btn" id="shot">Screenshot</button>
      <label class="chip-btn">Upload<input id="file" type="file" accept="image/*" hidden></label>
      <button class="chip-btn" id="noThumb">None</button>
    </div>
    <p class="hint" id="thumbHint"></p>

    <label class="field"><span>Title</span><input id="title" type="text"></label>
    <div class="two">
      <label class="field"><span>Client / brand</span><input id="client" type="text"></label>
      <label class="field small"><span>Year</span><input id="year" type="number" min="1990" max="2100"></label>
    </div>
    <div class="two">
      <label class="field"><span>Link</span><input id="url" type="url"></label>
      <label class="field small"><span>Duration</span><input id="duration" type="text" placeholder="1:12"></label>
    </div>

    <div id="groups"></div>

    <label class="field"><span>Description <i>(optional)</i></span><textarea id="desc" rows="2"></textarea></label>

    <div class="dup" id="dup" hidden>Already in the directory. Saving will update it.</div>
    <div class="row sticky">
      <button id="save" class="btn dark">Add to Directory</button>
      <span id="msg" class="msg"></span>
    </div>
  </section>

  <section id="loading"><p class="hint">Reading page…</p></section>

  <script src="popup.js"></script>
</body>
</html>
